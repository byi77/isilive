name: Sync M+ Forces DB

on:
  schedule:
    # Every Thursday 06:00 UTC (= 07:00 CET / 08:00 CEST).
    # Timed after US Tuesday patch day + EU Wednesday weekly reset, when MDT
    # releases typically cluster. A weekly cadence is frequent enough to catch
    # drift and rare enough to avoid noise in quiet weeks.
    - cron: "0 6 * * 4"
  workflow_dispatch:

concurrency:
  # Prevent overlapping runs (e.g. scheduled + manual dispatch) from racing on
  # push. Queue behind any in-flight run instead of cancelling it mid-push.
  group: sync-mplus-forces
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Lua
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.1"

      - name: Clone MDT
        run: git clone --depth 1 https://github.com/Nnoggie/MythicDungeonTools tools/cache/mdt

      - name: Regenerate DB
        run: lua tools/sync_mdt_forces.lua

      - name: Clean up MDT clone before CI gates
        run: rm -rf tools/cache

      - name: Detect DB changes
        id: diff
        run: |
          if git diff --quiet -- data/isiLive_mplus_forces.lua; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No DB changes — skipping validation and commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup LuaRocks
        if: steps.diff.outputs.changed == 'true'
        uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6

      - name: Install luacheck
        if: steps.diff.outputs.changed == 'true'
        run: |
          luarocks install luacheck 1.2.0-1
          echo "$(luarocks path --lr-bin)" >> "$GITHUB_PATH"

      - name: Install LuaFileSystem
        if: steps.diff.outputs.changed == 'true'
        run: luarocks install luafilesystem 1.8.0-1

      - name: StyLua (check)
        if: steps.diff.outputs.changed == 'true'
        uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5
        with:
          token: ${{ github.token }}
          version: "2.3.1"
          args: --check .

      - name: Luacheck
        if: steps.diff.outputs.changed == 'true'
        run: |
          command -v luacheck
          luacheck --version || true
          luacheck --exclude-files ".luarocks/**" -- .

      - name: Lua Syntax Check
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -e
          for file in $(find . -type f -name "*.lua" -not -path "./.luarocks/*"); do
            echo "Checking $file"
            tmp="$(mktemp)"
            sed '1s/^\xEF\xBB\xBF//' "$file" > "$tmp"
            lua -e "assert(loadfile('$tmp'))"
            rm -f "$tmp"
          done

      - name: Lua Metrics Check
        if: steps.diff.outputs.changed == 'true'
        run: |
          eval "$(luarocks path --lua-version 5.1)"
          ISILIVE_MAX_FILE_LINES=3200 ISILIVE_MAX_FUNCTION_LINES=420 lua tools/lua_metrics_check.lua

      - name: Locale Drift Check
        if: steps.diff.outputs.changed == 'true'
        run: lua tools/check_locale_drift.lua

      - name: Hardcoded Strings Check
        if: steps.diff.outputs.changed == 'true'
        run: lua tools/check_hardcoded_strings.lua

      - name: UI Color Tokens Check
        if: steps.diff.outputs.changed == 'true'
        run: lua tools/check_ui_color_tokens.lua

      - name: Sound Channel Check
        if: steps.diff.outputs.changed == 'true'
        run: lua tools/check_sound_channel.lua

      - name: Chat Color Safety Check
        if: steps.diff.outputs.changed == 'true'
        run: lua tools/check_chat_color_safety.lua

      - name: WoW 12.0 API Compliance Check
        if: steps.diff.outputs.changed == 'true'
        run: lua tools/check_wow_api_compliance.lua

      - name: Format String Consistency Check
        if: steps.diff.outputs.changed == 'true'
        run: lua tools/check_format_string_consistency.lua

      - name: Secret Value Guards Check
        if: steps.diff.outputs.changed == 'true'
        run: lua tools/check_secret_value_guards.lua

      - name: Addon Message Size Check
        if: steps.diff.outputs.changed == 'true'
        run: lua tools/check_addon_message_size.lua

      - name: Button Label Length Check
        if: steps.diff.outputs.changed == 'true'
        run: lua tools/check_button_label_length.lua

      - name: TOC File List Check
        if: steps.diff.outputs.changed == 'true'
        run: lua tools/check_toc_file_list.lua

      - name: Dead Locale Keys Check
        if: steps.diff.outputs.changed == 'true'
        run: lua tools/check_dead_locale_keys.lua

      - name: Settings Default Pattern Check
        if: steps.diff.outputs.changed == 'true'
        run: lua tools/check_settings_default_pattern.lua

      - name: M+ Forces DB Lifetime
        if: steps.diff.outputs.changed == 'true'
        run: lua tools/check_mplus_db_lifetime.lua

      - name: Nameplate Key-Start Simulator
        if: steps.diff.outputs.changed == 'true'
        run: lua tools/simulate_nameplate_keystart.lua all

      - name: SavedVariables Reload Simulator
        if: steps.diff.outputs.changed == 'true'
        run: lua tools/simulate_savedvariables_reload.lua

      - name: Key-Start Lifecycle Simulator
        if: steps.diff.outputs.changed == 'true'
        run: lua tools/simulate_key_start_lifecycle.lua

      - name: Hidden-Sync Reload Simulator
        if: steps.diff.outputs.changed == 'true'
        run: lua tools/simulate_hidden_sync_reload.lua

      - name: Raid-Party Cycle Simulator
        if: steps.diff.outputs.changed == 'true'
        run: lua tools/simulate_raid_party_cycle.lua

      - name: LFG Join Target Chain Simulator
        if: steps.diff.outputs.changed == 'true'
        run: lua tools/simulate_lfg_join_target_chain.lua

      - name: Reload-Storm Simulator
        if: steps.diff.outputs.changed == 'true'
        run: lua tools/simulate_reload_storm.lua

      - name: Key-Completion Lifecycle Simulator
        if: steps.diff.outputs.changed == 'true'
        run: lua tools/simulate_key_completion_lifecycle.lua

      - name: M+ Timer Lifecycle Simulator
        if: steps.diff.outputs.changed == 'true'
        run: lua tools/simulate_mplus_timer_lifecycle.lua

      - name: Deterministic Usecase + Rules Logic Validation
        if: steps.diff.outputs.changed == 'true'
        run: lua tools/validate_usecases.lua

      - name: Commit + push directly to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/isiLive_mplus_forces.lua
          MDT_VERSION=$(lua -e 'local f=assert(loadfile("data/isiLive_mplus_forces.lua")); local t={}; f("isiLive",t); io.write(t.MPlusForces.mdtVersion)')
          git commit -m "data: refresh M+ forces DB from MDT ${MDT_VERSION}"
          git push origin HEAD:main
