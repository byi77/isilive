name: Validate Season Intake

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

concurrency:
  group: validate-season-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Lua
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.1"

      - name: Validate season intake
        id: intake
        continue-on-error: true
        # Every season present in the intake is validated on its own and gets its
        # own report and issue, so rows for the next season can sit next to the
        # verified rows of the running one.
        run: |
          mkdir -p tools/cache/season_intake
          set +e
          lua tools/check_season_intake.lua > tools/cache/season_intake/season-intake.md
          status=$?
          lua tools/check_season_intake.lua --list-seasons > tools/cache/season_intake/seasons.txt
          list_status=$?
          lua tools/check_season_intake.lua --print-active-season > tools/cache/season_intake/active-season.txt
          if [ "${list_status}" -ne 0 ] || [ ! -s tools/cache/season_intake/seasons.txt ]; then
            echo "unresolved" > tools/cache/season_intake/seasons.txt
            cp tools/cache/season_intake/season-intake.md tools/cache/season_intake/season-intake-unresolved.md
          else
            while IFS= read -r season; do
              [ -z "${season}" ] && continue
              lua tools/check_season_intake.lua "--season=${season}" > "tools/cache/season_intake/season-intake-${season}.md"
            done < tools/cache/season_intake/seasons.txt
          fi
          set -e
          cat tools/cache/season_intake/season-intake.md >> "$GITHUB_STEP_SUMMARY"
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit "${status}"

      - name: Open or update season intake issues
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require("fs");
            const seasons = fs
              .readFileSync("tools/cache/season_intake/seasons.txt", "utf8")
              .split(/\r?\n/)
              .map((line) => line.trim())
              .filter((line) => line !== "");
            // The intake is a pre-activation surface: once a season is the active
            // one its issue is closed instead of reopened every day.
            let activeSeason = "";
            try {
              activeSeason = fs.readFileSync("tools/cache/season_intake/active-season.txt", "utf8").trim();
            } catch (error) {
              core.warning("Active season unresolved: " + error.message);
            }

            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            for (const season of seasons) {
              const marker = `<!-- isiLive:season-intake:${season} -->`;
              const title = `Season Intake Status: ${season}`;
              const report = fs.readFileSync(`tools/cache/season_intake/season-intake-${season}.md`, "utf8");
              const body = [
                marker,
                "",
                "This issue is updated by the Season Intake workflow.",
                "",
                "The intake is a pre-activation collection surface only. A season with `autoDetectFromChallengeMaps = true` activates itself once Blizzard ships the exact matching challenge-map set; `SeasonData.ACTIVE_SEASON_ID` remains the manual fallback.",
                "",
                report,
              ].join("\n");

              const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
              if (season === activeSeason) {
                if (existing) {
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: existing.number,
                    body,
                    state: "closed",
                  });
                  core.notice("Closed season intake issue #" + existing.number + " for the active season");
                }
                continue;
              }
              if (existing) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body,
                });
                core.notice("Updated existing season intake issue #" + existing.number);
              } else {
                const created = await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                });
                core.notice("Created season intake issue #" + created.data.number);
              }
            }

      - name: Fail on invalid intake structure
        if: steps.intake.outputs.status != '0'
        run: exit 1

      - name: Upload season intake artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: season-intake-status
          path: tools/cache/season_intake/
          if-no-files-found: error
