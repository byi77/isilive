name: Sync Warcraft Logs Seeds

on:
  schedule:
    # Every Thursday 07:00 UTC, one hour after the forces DB sync.
    - cron: "0 7 * * 4"
  workflow_dispatch:

concurrency:
  group: sync-wcl-seeds
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Warcraft Logs allows 1000 points per hour; the script waits for the reset.
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore run cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .wcl-cache
          key: wcl-runs-${{ github.run_id }}
          restore-keys: wcl-runs-

      - name: Regenerate seeds
        env:
          WARCRAFTLOGS_CLIENT_ID: ${{ secrets.WARCRAFTLOGS_CLIENT_ID }}
          WARCRAFTLOGS_CLIENT_SECRET: ${{ secrets.WARCRAFTLOGS_CLIENT_SECRET }}
        run: |
          python3 -I tools/sync_wcl_forces.py \
            --cache .wcl-cache/runs.json \
            --out data/isiLive_forces_seed.lua \
            --time-out data/isiLive_time_seed.lua

      - name: Format generated files
        uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5
        with:
          token: ${{ github.token }}
          version: "2.3.1"
          args: data/isiLive_forces_seed.lua data/isiLive_time_seed.lua

      - name: Detect changes
        id: diff
        # The generated date alone is no change worth a pull request.
        run: |
          if git diff -I '^-- .*as of|^-- of ' --quiet -- data/isiLive_forces_seed.lua data/isiLive_time_seed.lua; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git checkout -- data/isiLive_forces_seed.lua data/isiLive_time_seed.lua
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Lua
        if: steps.diff.outputs.changed == 'true'
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.1"

      - name: Setup LuaRocks
        if: steps.diff.outputs.changed == 'true'
        uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6

      - name: Install LuaFileSystem
        if: steps.diff.outputs.changed == 'true'
        run: luarocks install luafilesystem 1.8.0-1

      - name: Deterministic Usecase + Rules Logic Validation
        if: steps.diff.outputs.changed == 'true'
        run: |
          eval "$(luarocks path --lua-version 5.1)"
          lua tools/validate_usecases.lua

      - name: Commit + push directly to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/isiLive_forces_seed.lua data/isiLive_time_seed.lua
          git commit -m "data: refresh forces and time seeds from Warcraft Logs"
          git push origin HEAD:main
