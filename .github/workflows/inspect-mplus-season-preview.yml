name: Inspect M+ Season Preview

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season ID from game/isiLive_season_data.lua"
        required: true
        default: "midnight_s2"

concurrency:
  group: inspect-mplus-season-preview-${{ github.event.inputs.season || 'midnight_s2' }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      SEASON_ID: ${{ github.event.inputs.season || 'midnight_s2' }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Lua
        uses: leafo/gh-actions-lua@8c9e175e7a3d77e21f809eefbee34a19b858641b # v12
        with:
          luaVersion: "5.1"

      - name: Clone MDT
        run: git clone --depth 1 https://github.com/Nnoggie/MythicDungeonTools tools/cache/mdt

      - name: Build MDT season preview report
        id: preview
        run: |
          mkdir -p tools/cache/season_preview
          lua tools/inspect_mdt_season_preview.lua "--season=${SEASON_ID}" --mdt=tools/cache/mdt > tools/cache/season_preview/mdt-season-preview.md
          cat tools/cache/season_preview/mdt-season-preview.md >> "$GITHUB_STEP_SUMMARY"
          candidate_count="$(sed -n 's/^- Candidate matches: //p' tools/cache/season_preview/mdt-season-preview.md | head -n 1)"
          forces_ready="$(sed -n 's/^- Forces-ready: //p' tools/cache/season_preview/mdt-season-preview.md | head -n 1)"
          echo "candidate_count=${candidate_count:-0}" >> "$GITHUB_OUTPUT"
          echo "forces_ready=${forces_ready:-no}" >> "$GITHUB_OUTPUT"

      - name: Open or update issue when structurally usable forces sources are available
        if: steps.preview.outputs.forces_ready == 'yes'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- isiLive:mplus-forces-ready:" + process.env.SEASON_ID + " -->";
            const title = "S2 Forces sources available in MDT for " + process.env.SEASON_ID;
            const report = fs.readFileSync("tools/cache/season_preview/mdt-season-preview.md", "utf8");
            const body = [
              marker,
              "",
              "The daily MDT season preview found structurally usable Forces source data for every configured dungeon in `" + process.env.SEASON_ID + "`.",
              "",
              "This is an availability signal, not proof that upstream contains every intended NPC. The report verifies exact configured map IDs, positive dungeon totals, and at least one positive NPC Forces entry per dungeon. The runtime Forces DB must still be generated and validated in a reviewed repository change.",
              "",
              report,
            ].join("\n");

            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              per_page: 100,
            });
            const existing = issues.find((issue) =>
              !issue.pull_request && typeof issue.body === "string" && issue.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body,
                state: "open",
              });
              core.notice("Updated existing preview issue #" + existing.number);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
              core.notice("Created preview issue #" + created.data.number);
            }

      - name: Upload MDT season preview artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: mplus-season-preview-${{ env.SEASON_ID }}
          path: tools/cache/season_preview/
          if-no-files-found: error
