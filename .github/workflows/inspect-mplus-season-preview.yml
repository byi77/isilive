name: Inspect M+ Season Preview

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season ID from data/isiLive_seasons.lua (empty: upcomingSeasonID, otherwise activeSeasonID)"
        required: false
        default: ""

concurrency:
  group: inspect-mplus-season-preview-${{ github.event.inputs.season || 'manifest-default' }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Lua
        uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13.1.0
        with:
          luaVersion: "5.1"

      - name: Resolve target season from the manifest
        id: season
        env:
          REQUESTED_SEASON: ${{ github.event.inputs.season }}
        run: |
          season="${REQUESTED_SEASON}"
          if [ -z "${season}" ]; then
            season="$(lua tools/inspect_mdt_season_preview.lua --print-default-season)"
          fi
          echo "SEASON_ID=${season}" >> "$GITHUB_ENV"
          echo "season_id=${season}" >> "$GITHUB_OUTPUT"

      - name: Clone MDT
        run: git clone --depth 1 https://github.com/Nnoggie/MythicDungeonTools tools/cache/mdt

      - name: Build MDT season preview report
        id: preview
        run: |
          mkdir -p tools/cache/season_preview
          lua tools/inspect_mdt_season_preview.lua "--season=${SEASON_ID}" --mdt=tools/cache/mdt > tools/cache/season_preview/mdt-season-preview.md
          cat tools/cache/season_preview/mdt-season-preview.md >> "$GITHUB_STEP_SUMMARY"
          candidate_count="$(sed -n 's/^- Candidate matches: //p' tools/cache/season_preview/mdt-season-preview.md | head -n 1)"
          forces_ready="$(sed -n 's/^- Forces-ready: //p' tools/cache/season_preview/mdt-season-preview.md | head -n 1)"
          season_label="$(sed -n 's/^- Season label: //p' tools/cache/season_preview/mdt-season-preview.md | head -n 1)"
          echo "candidate_count=${candidate_count:-0}" >> "$GITHUB_OUTPUT"
          echo "forces_ready=${forces_ready:-no}" >> "$GITHUB_OUTPUT"
          echo "SEASON_LABEL=${season_label:-${SEASON_ID}}" >> "$GITHUB_ENV"
          # The season the committed runtime Forces DB already serves.
          runtime_db_season="$(sed -n 's/^  season = "\([^"]*\)",$/\1/p' data/isiLive_mplus_forces.lua | head -n 1)"
          echo "RUNTIME_DB_SEASON=${runtime_db_season}" >> "$GITHUB_ENV"

      - name: Open or update issue when structurally usable forces sources are available
        if: steps.preview.outputs.forces_ready == 'yes'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- isiLive:mplus-forces-ready:" + process.env.SEASON_ID + " -->";
            const title = process.env.SEASON_LABEL + " Forces sources available in MDT for " + process.env.SEASON_ID;
            const report = fs.readFileSync("tools/cache/season_preview/mdt-season-preview.md", "utf8");
            const body = [
              marker,
              "",
              "The daily MDT season preview found structurally usable Forces source data for every configured dungeon in `" + process.env.SEASON_ID + "`.",
              "",
              "This is an availability signal, not proof that upstream contains every intended NPC. The report verifies exact configured map IDs, positive dungeon totals, and at least one positive NPC Forces entry per dungeon. The runtime Forces DB must still be generated and validated in a reviewed repository change.",
              "",
              report,
            ].join("\n");

            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              per_page: 100,
            });
            const existing = issues.find((issue) =>
              !issue.pull_request && typeof issue.body === "string" && issue.body.includes(marker)
            );

            // Once the reviewed runtime DB covers the season the signal is consumed:
            // close the issue instead of reopening it every day.
            if (process.env.RUNTIME_DB_SEASON === process.env.SEASON_ID) {
              if (existing && existing.state === "open") {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body,
                  state: "closed",
                });
                core.notice("Closed preview issue #" + existing.number + ": runtime Forces DB already serves the season");
              }
            } else if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body,
                state: "open",
              });
              core.notice("Updated existing preview issue #" + existing.number);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
              core.notice("Created preview issue #" + created.data.number);
            }

      - name: Upload MDT season preview artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mplus-season-preview-${{ steps.season.outputs.season_id }}
          path: tools/cache/season_preview/
          if-no-files-found: error
