name: Release

on:
  push:
    tags:
      - "isiLive_release_*"

jobs:
  quality-gate:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/isiLive_release_') }}
    uses: ./.github/workflows/lua-check.yml
    permissions:
      contents: read

  publish-release:
    needs: quality-gate
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/isiLive_release_') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Release Trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: pwsh -File tools/validate_release_trigger.ps1 -Mode release
      - name: Checkout release tag
        id: release_context
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${REF_NAME}"
          case "${TAG}" in
            isiLive_release_*) ;;
            *) echo "Unexpected tag '${TAG}' — expected isiLive_release_* prefix."; exit 1 ;;
          esac
          VERSION="${TAG#isiLive_release_}"
          git fetch --force --tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git checkout --detach "${TAG}"
          echo "RELEASE_TAG=${TAG}" >> "${GITHUB_ENV}"
          echo "RELEASE_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Prepare GitHub/WowUp asset
        run: |
          set -euo pipefail
          rm -rf dist package
          mkdir -p dist package/isiLive
          while IFS= read -r -d '' file; do
            case "${file}" in
              .github/*|.githooks/*|.vscode/*|.claude/*|.gitattributes|.editorconfig|.luacheckrc|.stylua.toml|.styluaignore|.luarocks/*|.luacov|.gitignore|.pkgmeta|docs/*|README.md|AGENTS.md|CLAUDE.md|tools/*|testmodul/*|luacheck_output.txt|isiLive.png|isiLive_EnterDungeon.png|isiLive_H_ui.png|isiLive_InviteAccepted.png|isiLive_LFGBuffRating.png|isiLive_LFGBuffRating2.png|isiLive_MPlus_ui.png|isiLive_M_ui.png|isiLive_PortalNavigator.png|isiLive_Statsbox.png|isiLive_V_ui.png|isiLive_screenshot.png)
                continue
                ;;
            esac
            target="package/isiLive/${file}"
            mkdir -p "$(dirname "${target}")"
            cp "${file}" "${target}"
          done < <(git ls-files -z)
          asset_path="dist/isiLive-${RELEASE_VERSION}.zip"
          (cd package && zip -qr "../${asset_path}" isiLive)
          if ! unzip -l "${asset_path}" "isiLive/isiLive.toc" >/dev/null 2>&1; then
            echo "Release zip must contain isiLive/isiLive.toc at the zip root for WowUp Hub."
            exit 1
          fi
          echo "GITHUB_RELEASE_ASSET=${asset_path}" >> "${GITHUB_ENV}"
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${REF_NAME}"
          case "${TAG}" in
            isiLive_release_*) ;;
            *) echo "Unexpected tag '${TAG}' — expected isiLive_release_* prefix."; exit 1 ;;
          esac
          VERSION="${TAG#isiLive_release_}"
          VERSION_RE=$(printf '%s\n' "${VERSION}" | sed 's/\./\\./g')
          NOTES_FILE="$(mktemp)"
          awk -v re="${VERSION_RE}" '
            BEGIN { found=0; inblock=0 }
            {
              if (!inblock && match($0, "^## .* Version " re "[^0-9]")) {
                inblock=1; found=1; print; next
              }
              if (inblock && /^## /) { exit }
              if (inblock) { print }
            }
          ' docs/CHANGELOG.md > "${NOTES_FILE}"
          if [ ! -s "${NOTES_FILE}" ]; then
            echo "No CHANGELOG section found for version ${VERSION} — using fallback body."
            printf '## v%s\n\nSee docs/CHANGELOG.md for release notes.\n' "${VERSION}" > "${NOTES_FILE}"
          fi
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release for tag ${TAG} already exists — updating notes."
            gh release edit "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "v${VERSION}" \
              --notes-file "${NOTES_FILE}"
            gh release upload "${TAG}" "${GITHUB_RELEASE_ASSET}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${TAG}" \
              "${GITHUB_RELEASE_ASSET}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "v${VERSION}" \
              --notes-file "${NOTES_FILE}" \
              --latest
          fi
          rm -f "${NOTES_FILE}"
          echo "GitHub Release v${VERSION} published."
      - name: Validate CurseForge configuration
        env:
          CURSE_PROJECT_ID: ${{ vars.CURSE_PROJECT_ID }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          set -euo pipefail
          case "${CURSE_PROJECT_ID}" in
            ''|*[!0-9]*)
              echo "CURSE_PROJECT_ID must be numeric. Current value is invalid."
              exit 1
              ;;
          esac
          if [ -z "${CF_API_KEY}" ]; then
            echo "CF_API_KEY secret must be configured."
            exit 1
          fi
      - name: Publish existing zip to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CURSE_PROJECT_ID: ${{ vars.CURSE_PROJECT_ID }}
        run: |
          set -euo pipefail
          TOC_INTERFACE="$(awk -F': *' '/^## Interface:/ { print $2; exit }' isiLive.toc)"
          if [ -z "${TOC_INTERFACE}" ]; then
            echo "isiLive.toc must contain a retail ## Interface value."
            exit 1
          fi
          if [ $(( ${#TOC_INTERFACE} % 2 )) -ne 0 ]; then
            echo "Unsupported TOC interface '${TOC_INTERFACE}'. Expected an even number of digits."
            exit 1
          fi
          GAME_VERSION="$((10#${TOC_INTERFACE:0:2})).$((10#${TOC_INTERFACE:2:1})).$((10#${TOC_INTERFACE:3}))"
          NOTES_FILE="$(mktemp)"
          if [ -s CHANGELOG_RELEASE.md ]; then
            cp CHANGELOG_RELEASE.md "${NOTES_FILE}"
          else
            printf 'Release %s\n' "${RELEASE_VERSION}" > "${NOTES_FILE}"
          fi
          METADATA_FILE="$(mktemp)"
          jq -n \
            --rawfile changelog "${NOTES_FILE}" \
            --arg display_name "isiLive-${RELEASE_VERSION}" \
            --arg game_version "${GAME_VERSION}" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $display_name,
              gameVersionNames: [$game_version],
              releaseType: "release"
            }' > "${METADATA_FILE}"
          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(
            curl --silent --show-error --location \
              --output "${RESPONSE_FILE}" \
              --write-out "%{http_code}" \
              --form "metadata=<${METADATA_FILE};type=application/json" \
              --form "file=@${GITHUB_RELEASE_ASSET};type=application/zip" \
              "https://wow.curseforge.com/api/projects/${CURSE_PROJECT_ID}/upload-file?token=${CF_API_KEY}"
          )"
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "CurseForge upload failed with HTTP ${HTTP_CODE}."
            cat "${RESPONSE_FILE}"
            exit 1
          fi
          if ! jq -e '.id' "${RESPONSE_FILE}" >/dev/null; then
            echo "CurseForge upload did not return a file id."
            cat "${RESPONSE_FILE}"
            exit 1
          fi
          echo "CurseForge upload accepted with file id $(jq -r '.id' "${RESPONSE_FILE}")."
