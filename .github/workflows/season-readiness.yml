name: Inspect Season Readiness

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: inspect-season-readiness
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Lua
        uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13.1.0
        with:
          luaVersion: "5.1"

      - name: Build season readiness report
        run: |
          mkdir -p tools/cache/season_readiness
          lua tools/inspect_season_readiness.lua > tools/cache/season_readiness/season-readiness.md
          cat tools/cache/season_readiness/season-readiness.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload season readiness artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: season-readiness-inspect
          path: tools/cache/season_readiness/
          if-no-files-found: error
