name: Inspect Season Readiness

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: inspect-season-readiness
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Lua
        uses: leafo/gh-actions-lua@8c9e175e7a3d77e21f809eefbee34a19b858641b # v12
        with:
          luaVersion: "5.1"

      - name: Build season readiness report
        run: |
          mkdir -p tools/cache/season_readiness
          lua tools/inspect_season_readiness.lua > tools/cache/season_readiness/season-readiness.md
          cat tools/cache/season_readiness/season-readiness.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload season readiness artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: season-readiness-inspect
          path: tools/cache/season_readiness/
          if-no-files-found: error
